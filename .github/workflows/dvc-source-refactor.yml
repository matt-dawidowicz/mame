name: DVC source refactor

on:
  push:
    branches:
    - cdi-dvc-upstream-completion
    paths:
    - '.github/workflows/dvc-source-refactor.yml'

permissions:
  contents: write

jobs:
  remove-save-reconstruction:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 1
    - name: Remove save-state reconstruction
      run: python3 .github/scripts/dvc_remove_save_reconstruction.py
    - name: Verify refactor
      run: |
        git diff --check
        test ! -e src/mame/philips/cdidvc_save_state.h
        ! git grep -n -E 'm_(save|audio_replay|video_replay)_' -- src/mame/philips/cdidvc.cpp src/mame/philips/cdidvc.h
        ! git grep -n 'cdidvc_save_state.h' -- src/mame/philips tests/emu/philips scripts/src/tests.lua
    - name: Remove temporary refactor machinery
      run: git rm .github/scripts/dvc_remove_save_reconstruction.py .github/workflows/dvc-source-refactor.yml
    - name: Commit refactor
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add -A
        git commit -m 'cdi: remove DVC save-state reconstruction'
        git push origin HEAD:cdi-dvc-upstream-completion
