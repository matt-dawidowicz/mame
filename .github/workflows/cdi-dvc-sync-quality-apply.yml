name: Apply CD-i DVC sync/quality batch

on:
  push:
    branches:
      - fix/cdi-dvc-sync-quality-20260910
    paths:
      - '.github/workflows/cdi-dvc-sync-quality-apply.yml'
      - '.cdi-dvc-sync-quality-trigger'

permissions:
  contents: write

concurrency:
  group: cdi-dvc-sync-quality-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cdi-dvc-sync-quality-20260910
          fetch-depth: 1
          sparse-checkout: |
            src/mame/philips/cdidvc.cpp
            src/mame/philips/cdidvc.h
            src/mame/philips/cdidvc_presentation.h
            scripts/cdi-dvc-sync-quality-apply.py
          sparse-checkout-cone-mode: false
      - name: Apply guarded source changes
        run: python3 scripts/cdi-dvc-sync-quality-apply.py
      - name: Verify patch shape
        run: |
          git diff --check
          grep -q 'select_video_sync_clock' src/mame/philips/cdidvc.cpp
          grep -q 'video_source_x_for_output' src/mame/philips/cdidvc.cpp
          grep -q 'm_fmv_syscr_programmed' src/mame/philips/cdidvc.h
          git diff --stat
      - name: Commit bounded batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mame/philips/cdidvc.cpp src/mame/philips/cdidvc.h
          git commit -m 'philips/cdi: sync DVC presentation and honor VCD cadence'
          git push origin HEAD:fix/cdi-dvc-sync-quality-20260910
