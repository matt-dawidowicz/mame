name: CD-i hardening validation

on:
  push:
    branches:
      - cdi-hardening-slave-100
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools

      - name: Source integrity
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check 894bae709845dc823d915c3ac9b52a8bc19c2486 HEAD
          git status --short

      - name: Build native tests
        run: make EMULATOR=0 TESTS=1 REGENIE=1 -j2

      - name: Run hardening tests
        run: ./mametests "[hardening]"

      - name: Run complete native suite
        run: ./mametests

      - name: Build CD-i validation emulator
        run: make SUBTARGET=cdivalidate SOURCES=src/mame/philips/cdi.cpp REGENIE=1 -j2

      - name: Validate CD-i emulator
        run: ./cdivalidate -validate

      - name: Build ASan tests
        run: make EMULATOR=0 TESTS=1 SANITIZE=address BUILDDIR=build-asan-tests REGENIE=1 -j2

      - name: Run ASan and leak suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ./mametests

      - name: Build ASan CD-i validation emulator
        run: make SUBTARGET=cdivalidate SOURCES=src/mame/philips/cdi.cpp SANITIZE=address BUILDDIR=build-asan-cdivalidate REGENIE=1 -j2

      - name: ASan validate CD-i emulator
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ./cdivalidate -validate

      - name: Final diff check
        run: |
          git diff --check 894bae709845dc823d915c3ac9b52a8bc19c2486 HEAD
          git status --short
