name: Apply CD-i consolidation/performance batch

on:
  push:
    branches:
      - perf/cdi-consolidation-benchmark-20260910
    paths:
      - '.cdi-optimization-trigger'
  workflow_dispatch:

concurrency:
  group: cdi-consolidation-performance-apply
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cdi-consolidation-benchmark-20260910
          fetch-depth: 1

      - name: Build and run focused audio benchmark
        run: |
          g++ -O3 -DNDEBUG -std=c++17 -Isrc/mame/philips \
            scripts/cdi_audio_mix_benchmark.cpp -o /tmp/cdi_audio_mix_benchmark
          /tmp/cdi_audio_mix_benchmark | tee /tmp/cdi_audio_mix_benchmark.txt

      - name: Apply guarded source changes
        run: python3 scripts/cdi-consolidation-perf-apply.py

      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat
          grep -q 'mix_fma_attenuated_pcm16' src/mame/philips/cdidvc.cpp
          test "$(grep -c 'for (int i = SECTOR_HEADER; i < SECTOR_SIZE; i += 2)' src/mame/philips/cdicdic.cpp)" -eq 1

      - name: Record benchmark in job summary
        run: |
          echo '## CD-i FMA audio mix microbenchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cdi_audio_mix_benchmark.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit bounded batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mame/philips/cdidvc.cpp src/mame/philips/cdicdic.cpp
          git commit -m 'philips/cdi: streamline audio mixing and sector copy'
          git push origin HEAD:perf/cdi-consolidation-benchmark-20260910
