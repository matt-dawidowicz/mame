name: Apply CD-i optimization batch

on:
  push:
    paths:
      - 'docs/.cdi-optimization-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python3 scripts/cdi-optimization-apply.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --stat
      - name: Commit optimization batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mame/philips/cdi.cpp src/mame/philips/cdidvc.cpp src/mame/philips/cdicdic.cpp tests/emu/philips/cdidvc.cpp tests/emu/philips/cdidvc_plmpeg.cpp scripts/src/tests.lua
          git commit -m 'philips/cdi: reduce audio-video runtime overhead'
          git push origin HEAD:${GITHUB_REF_NAME}
