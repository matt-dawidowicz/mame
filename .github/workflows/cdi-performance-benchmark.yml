name: CD-i performance benchmark

on:
  pull_request:
    paths:
      - '3rdparty/pl_mpeg/pl_mpeg.h'
      - 'src/mame/philips/cdiaudio.h'
      - 'src/mame/philips/cdidvc.cpp'
      - 'scripts/cdi_audio_mix_benchmark.cpp'
      - 'scripts/cdi_plmpeg_ingress_benchmark.cpp'
      - '.github/workflows/cdi-performance-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-mix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/mame/philips/cdiaudio.h
            src/mame/philips/cdiaudio_dsp56001.h
            scripts/cdi_audio_mix_benchmark.cpp
          sparse-checkout-cone-mode: false

      - name: Build benchmark
        run: |
          g++ -O3 -DNDEBUG -std=c++17 \
            scripts/cdi_audio_mix_benchmark.cpp -o /tmp/cdi_audio_mix_benchmark

      - name: Verify equivalence and measure
        run: /tmp/cdi_audio_mix_benchmark | tee /tmp/cdi_audio_mix_benchmark.txt

      - name: Publish result
        if: always()
        run: |
          echo '## CD-i audio-mix microbenchmark' >> "$GITHUB_STEP_SUMMARY"
          if test -f /tmp/cdi_audio_mix_benchmark.txt; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/cdi_audio_mix_benchmark.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  plmpeg-ingress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            3rdparty/pl_mpeg/pl_mpeg.h
            scripts/cdi_plmpeg_ingress_benchmark.cpp
          sparse-checkout-cone-mode: false

      - name: Build benchmark
        run: |
          g++ -O3 -DNDEBUG -std=c++17 \
            scripts/cdi_plmpeg_ingress_benchmark.cpp -o /tmp/cdi_plmpeg_ingress_benchmark

      - name: Verify byte-word equivalence and measure ingress granularity
        run: |
          /tmp/cdi_plmpeg_ingress_benchmark | tee /tmp/cdi_plmpeg_ingress_benchmark.txt
          grep -q '^byte_word_equivalence=pass$' /tmp/cdi_plmpeg_ingress_benchmark.txt

      - name: Publish result
        if: always()
        run: |
          echo '## CD-i PL_MPEG ingress microbenchmark' >> "$GITHUB_STEP_SUMMARY"
          echo 'Models the DVC dynamic-buffer refill pattern and compares one-byte, one-16-bit-bus-word, and whole-PES writes. The benchmark hard-gates exact logical unread-byte-stream equivalence for byte-vs-word writes across repeated consume/refill cycles. Timing remains informational; emulator-level semantics are enforced by the CD-i integration suite.' >> "$GITHUB_STEP_SUMMARY"
          if test -f /tmp/cdi_plmpeg_ingress_benchmark.txt; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/cdi_plmpeg_ingress_benchmark.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
