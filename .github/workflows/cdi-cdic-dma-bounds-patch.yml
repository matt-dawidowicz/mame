          Path('docs/cdi_cdic_dma_bounds_20260907.md').write_text('''# CDIC SRAM DMA bounds checkpoint — 2026-09-07

## Change

The Mono-I CDIC DMACTL loop now checks its word index before constructing the SRAM pointer. The HLE owns 0x4000 bytes (0x2000 words); any requested operand at word index 0x2000 or beyond terminates SCC68070 DMA channel 1 through `dma_channel_device_bus_error(0)` rather than accessing outside the allocation.

## Policy boundary

This is an **emulator memory-safety policy**, not a claim about physical IMS66490/CDIC behavior. No retained hardware measurement distinguishes wraparound, clipping, ignored cycles, or a bus/error response at the SRAM boundary. Until such evidence exists, MAME uses the SCC's existing device-bus-error path because it is bounded, externally visible, and does not fabricate wrap semantics.

## Regression

`tests/emu/philips/cdi_cdic_dma_integration.cpp` drives the real SCC68070 register map and CDIC DMACTL handler. It starts at CDIC byte address 0x3ffc with a three-word transfer:

- memory -> device: words at 0x3ffc and 0x3ffe transfer, the third operand at 0x4000 is rejected;
- device -> memory: the two valid words round-trip, while the third destination sentinel remains unchanged;
- both directions retain one untransferred SCC word, advance MAC by exactly four bytes, clear CA, assert COC+ERR, and report device bus error code 0x0a.

## Verification

The normal `CI (CD-i fast)` push workflow is the executable gate for this batch. Percentage updates in the unified worksheet describe the implemented/tested scope but remain contingent on that workflow completing successfully. They do not establish physical hardware semantics or retail compatibility.
''')

