name: CDIC DMA bounds validation

on:
  push:
    paths:
      - '.github/workflows/cdi-cdic-dma-bounds-patch.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OVERRIDE_CC: gcc
      OVERRIDE_CXX: g++
      ARCHOPTS: -U_FORTIFY_SOURCE
      SOURCES: src/mame/philips/cdi.cpp,src/mame/philips/cdidvc_plmpeg.cpp
      TESTS: 1
      TOOLS: 0
      OPTIMIZE: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdi-unified
          fetch-depth: 1

      - name: Apply CDIC SRAM bounds patch
        run: python3 scripts/cdi_apply_cdic_dma_bounds.py

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools

      - name: Configure compiler cache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --set-config=max_size=750M

      - name: Generate CD-i build
        run: make -j"$(nproc)" generate build/projects/sdl/mame/gmake-linux/Makefile

      - name: Build precompiled header
        run: make -j"$(nproc)" -C build/projects/sdl/mame/gmake-linux config=release64 precompile

      - name: Build CD-i helper tests
        run: make -j"$(nproc)" -C build/projects/sdl/mame/gmake-linux config=release64 cdihelpertests

      - name: Run CD-i helper tests
        run: ./cdihelpertests

      - name: Check DVC DMA liveness wiring
        run: python3 scripts/cdi_dvc_dma_liveness_audit.py

      - name: Build CD-i integration tests
        run: make -j"$(nproc)" -C build/projects/sdl/mame/gmake-linux config=release64 cdiintegrationtests

      - name: Run CD-i integration tests
        run: ./cdiintegrationtests

      - name: Publish tested source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mame/philips/cdicdic.cpp
          git rm .github/workflows/cdi-cdic-dma-bounds-patch.yml scripts/cdi_apply_cdic_dma_bounds.py
          git commit -m "cdic: bound SRAM DMA transfers"
          git push origin HEAD:cdi-unified
