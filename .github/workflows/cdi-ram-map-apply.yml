name: CD-i RAM map apply

on:
  push:
    branches:
      - fix/cdi-ram-mmu-20260910
    paths:
      - '.github/workflows/cdi-ram-map-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cdi-ram-mmu-20260910

      - name: Apply evidence-backed Mono-I RAM correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match for {old!r}, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/mame/philips/cdi.cpp",
              "\tmap(0x500000, 0x57ffff).ram();\n",
              "\t// 0x500000-0xcfffff is unmapped expansion-probe space on Mono-I.\n"
              "\t// Leave the base bus-error mapping visible until a real expansion owns it.\n")

          replacements = {
              "\tstatic constexpr uint16_t BASE_RAM = 0x1400U; // 0x500000 physical RAM\n":
                  "\tstatic constexpr uint16_t BASE_RAM = 0x0100U; // 0x040000 physical plane RAM\n",
              "\tstatic constexpr uint16_t BASE_A = 0x1400U;\n":
                  "\tstatic constexpr uint16_t BASE_A = 0x0040U;\n",
              "\tstatic constexpr uint16_t BASE_B = 0x1500U;\n":
                  "\tstatic constexpr uint16_t BASE_B = 0x0080U;\n",
              "\tstatic constexpr uint32_t PHYSICAL_A = 0x501234U;\n":
                  "\tstatic constexpr uint32_t PHYSICAL_A = 0x011234U;\n",
              "\tstatic constexpr uint32_t PHYSICAL_B = 0x541234U;\n":
                  "\tstatic constexpr uint32_t PHYSICAL_B = 0x021234U;\n",
              "\tstatic constexpr uint32_t PHYSICAL_DATA = 0x500100U;\n":
                  "\tstatic constexpr uint32_t PHYSICAL_DATA = 0x040100U;\n",
              "\tstatic constexpr uint32_t PHYSICAL_WRITE = 0x500120U;\n":
                  "\tstatic constexpr uint32_t PHYSICAL_WRITE = 0x040120U;\n",
              "\tstatic constexpr uint32_t PHYSICAL_BOUNDARY = 0x5003feU;\n":
                  "\tstatic constexpr uint32_t PHYSICAL_BOUNDARY = 0x0403feU;\n",
              "\tstatic constexpr uint32_t PHYSICAL_FETCH = 0x500000U;\n":
                  "\tstatic constexpr uint32_t PHYSICAL_FETCH = 0x040000U;\n",
          }
          for old, new in replacements.items():
              replace_once("tests/emu/philips/cdi_mmu_integration.cpp", old, new)
          PY

          git diff --check
          git diff -- src/mame/philips/cdi.cpp tests/emu/philips/cdi_mmu_integration.cpp

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "starlight_world"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git add src/mame/philips/cdi.cpp tests/emu/philips/cdi_mmu_integration.cpp
          git commit -m "fix(cdi): remove phantom Mono-I RAM aperture"
          git push origin HEAD:fix/cdi-ram-mmu-20260910
