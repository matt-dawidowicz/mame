name: CI (CD-i fast)

on:
  push:
    paths:
      - '.github/workflows/ci-cdi-fast.yml'
      - 'docs/.cdi-fast-ci-trigger'
      - '3rdparty/pl_mpeg/**'
      - 'scripts/src/tests.lua'
      - 'src/devices/cpu/m68000/scc68070*'
      - 'src/mame/philips/**'
      - 'tests/emu/machine/scc68070.cpp'
      - 'tests/emu/philips/**'
  pull_request:
    paths:
      - '.github/workflows/ci-cdi-fast.yml'
      - '3rdparty/pl_mpeg/**'
      - 'scripts/src/tests.lua'
      - 'src/devices/cpu/m68000/scc68070*'
      - 'src/mame/philips/**'
      - 'tests/emu/machine/scc68070.cpp'
      - 'tests/emu/philips/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cdi-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools
      - name: Build source-filtered CD-i emulator and tests
        env:
          OVERRIDE_CC: gcc
          OVERRIDE_CXX: g++
          ARCHOPTS: -U_FORTIFY_SOURCE
          SOURCES: src/mame/philips/cdi.cpp
          TESTS: 1
          TOOLS: 0
        run: make -j3
      - name: Run Philips helper tests
        run: ./mametests '[philips]'
      - name: Validate source-filtered emulator
        run: ./mame -validate
