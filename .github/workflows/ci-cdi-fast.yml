name: CI (CD-i fast)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ci-cdi-fast.yml'
      - '3rdparty/pl_mpeg/**'
      - 'scripts/src/tests.lua'
      - 'src/devices/cpu/m68000/scc68070*'
      - 'src/mame/philips/**'
      - 'tests/emu/machine/scc68070.cpp'
      - 'tests/emu/philips/**'
  pull_request:
    paths:
      - '.github/workflows/ci-cdi-fast.yml'
      - '3rdparty/pl_mpeg/**'
      - 'scripts/src/tests.lua'
      - 'src/devices/cpu/m68000/scc68070*'
      - 'src/mame/philips/**'
      - 'tests/emu/machine/scc68070.cpp'
      - 'tests/emu/philips/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cdi-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      OVERRIDE_CC: gcc
      OVERRIDE_CXX: g++
      ARCHOPTS: -U_FORTIFY_SOURCE
      SOURCES: src/mame/philips/cdi.cpp,src/mame/philips/cdidvc_plmpeg.cpp
      TESTS: 1
      TOOLS: 0
      OPTIMIZE: 0
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CDI_CCACHE_KEY: cdi-ccache-linux-v4

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ccache \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libfontconfig-dev \
            libasound2-dev \
            libxinerama-dev \
            libxi-dev \
            qt6-base-dev \
            qt6-base-dev-tools

      # Seed this immutable cache once.  Subsequent exact hits restore it but do
      # not spend time recompressing and uploading hundreds of MB after every run.
      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ env.CDI_CCACHE_KEY }}
          restore-keys: |
            cdi-ccache-Linux-

      - name: Configure compiler cache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --set-config=max_size=750M
          ccache --zero-stats

      # Project generation compresses thousands of layout files.  Cache those
      # deterministic build-system products and regenerate only when the MAME
      # build scripts themselves change.
      - name: Restore generated CD-i build
        id: generated-restore
        uses: actions/cache@v4
        with:
          path: |
            build/projects/sdl/mame/gmake-linux
            build/generated
          key: cdi-generated-linux-v4-${{ hashFiles('makefile', 'scripts/**/*.lua', 'scripts/**/*.py') }}

      - name: Generate CD-i build
        if: steps.generated-restore.outputs.cache-hit != 'true'
        run: |
          make -j"$(nproc)" \
            generate \
            build/projects/sdl/mame/gmake-linux/Makefile

      - name: Build precompiled header
        run: |
          make -j"$(nproc)" \
            -C build/projects/sdl/mame/gmake-linux \
            config=release64 \
            precompile

      - name: Build CD-i helper tests
        run: |
          make -j"$(nproc)" \
            -C build/projects/sdl/mame/gmake-linux \
            config=release64 \
            cdihelpertests

      - name: Run CD-i helper tests
        run: ./cdihelpertests

      - name: Build CD-i integration tests
        run: |
          make -j"$(nproc)" \
            -C build/projects/sdl/mame/gmake-linux \
            config=release64 \
            cdiintegrationtests

      - name: Run CD-i integration tests
        run: ./cdiintegrationtests

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
