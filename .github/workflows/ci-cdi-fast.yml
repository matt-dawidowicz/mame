name: CI (CD-i fast)

on:
  push:
    paths:
      - '.github/workflows/ci-cdi-fast.yml'
      - '3rdparty/pl_mpeg/**'
      - 'scripts/src/tests.lua'
      - 'src/devices/cpu/m68000/scc68070*'
      - 'src/mame/philips/**'
      - 'tests/emu/machine/scc68070.cpp'
      - 'tests/emu/philips/**'
  pull_request:
    paths:
      - '.github/workflows/ci-cdi-fast.yml'
      - '3rdparty/pl_mpeg/**'
      - 'scripts/src/tests.lua'
      - 'src/devices/cpu/m68000/scc68070*'
      - 'src/mame/philips/**'
      - 'tests/emu/machine/scc68070.cpp'
      - 'tests/emu/philips/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cdi-fast:
    runs-on: ubuntu-latest

    env:
      OVERRIDE_CC: gcc
      OVERRIDE_CXX: g++
      ARCHOPTS: -U_FORTIFY_SOURCE
      SOURCES: src/mame/philips/cdi.cpp,src/mame/philips/cdidvc_plmpeg.cpp
      TESTS: 1
      TOOLS: 0
      OPTIMIZE: 0
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libfontconfig-dev \
            libasound2-dev \
            libxinerama-dev \
            libxi-dev

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: cdi-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cdi-ccache-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --set-config=max_size=750M
          ccache --zero-stats

      - name: Generate CD-i build
        run: |
          make -j"$(nproc)" \
            generate \
            build/projects/sdl/mame/gmake-linux/Makefile

      - name: Build only CD-i test targets
        run: |
          make -j"$(nproc)" \
            -C build/projects/sdl/mame/gmake-linux \
            config=release64 \
            precompile

          make -j"$(nproc)" \
            -C build/projects/sdl/mame/gmake-linux \
            config=release64 \
            mametests \
            cdiintegrationtests

      - name: Run Philips helper tests
        run: ./mametests '[philips]'

      - name: Run CD-i integration tests
        run: ./cdiintegrationtests

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: cdi-ccache-${{ runner.os }}-${{ github.run_id }}
