name: CD-i audio completion

on:
  push:
    branches:
    - cdi-audio-completion
    paths:
    - '.github/workflows/cdic-audio-completion.yml'
    - '.github/scripts/cdic_audio_completion.py'
    - 'scripts/src/tests.lua'
    - 'src/mame/philips/cdicdic.cpp'
    - 'src/mame/philips/cdicdic.h'
    - 'src/mame/philips/cdicdic_audio.h'
    - 'tests/emu/philips/cdicdic.cpp'
    - 'tests/emu/philips/cdicdic_audio.cpp'

permissions:
  contents: write

jobs:
  cdic-audio-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 1
    - name: Apply live audio completion patch
      run: python3 .github/scripts/cdic_audio_completion.py
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools
    - name: Build unit tests
      env:
        TESTS: 1
        EMULATOR: 0
        TOOLS: 0
      run: make -j3
    - name: Run CDIC tests
      run: ./mametests "[emu][philips][cdic]"

  cdic-audio-live-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 1
    - name: Apply live audio completion patch
      run: python3 .github/scripts/cdic_audio_completion.py
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools
    - name: Build Philips CD-i driver
      env:
        SOURCES: src/mame/philips/cdi.cpp
        REGENIE: 1
        TOOLS: 0
      run: make -j3

  commit-audio-completion:
    needs:
    - cdic-audio-tests
    - cdic-audio-live-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 1
    - name: Apply certified source patch
      run: python3 .github/scripts/cdic_audio_completion.py
    - name: Remove temporary certification machinery
      run: |
        rm .github/scripts/cdic_audio_completion.py
        rm .github/workflows/cdic-audio-completion.yml
    - name: Verify patch cleanliness
      run: |
        git diff --check
        git status --short
    - name: Commit certified audio implementation
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "cdi: complete base audio processing"
        git push origin HEAD:cdi-audio-completion
